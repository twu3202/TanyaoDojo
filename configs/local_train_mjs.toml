# [5060 Ti / WSL] 新数据臂(2026-10-06 设计;10-07 用户决定照跑,覆盖了质量探针的预注册纳入规则)= v11 配方逐项不变,只换数据:
#   天凤凤凰 2019–2026(v11 的 1,289,661 局)+ 雀魂王座 89,181 + 雀魂玉间 1,254,064(修补后,丢弃小局见 drop_kyoku),同一个 file index 均匀洗牌。
# 步数:max_steps = 1.21M × (总训练样本 / 天凤样本) = 1.21M × 1.855 = 2,245,200,停在 2,255,200(v11 1.21M → 1.22M);
#   样本按每局决策数估计:天凤 1,289,661 × 661.6 + 王座 89,181 × 646.7 + 玉间 1,254,064 × 535.8(扣掉丢弃小局)。
#   与 v11 训到同一个 epoch 比例;步数随数据变长写进本臂定义。
# 判读(预注册,同 B1):12k 配对 v11 < 0 止损;否则 100k,本臂 − v11 ≥ +0.5 且 z ≥ 2 通过。
# 代码:Mortal_mjs/mortal = Mortal_symaug 树 + patches/majsoul_data/dataloader.patch(读 start_game.drop_kyoku,跳过丢信息的小局)。

[control]
version = 4
online = false
state_file = '/home/r/Projects/better_mortal/runs/mjs/mortal.pth'
best_state_file = '/home/r/Projects/better_mortal/runs/mjs/best.pth'
tensorboard_dir = '/home/r/Projects/better_mortal/runs/mjs/tb'
device = 'cuda:0'
enable_cudnn_benchmark = true
enable_amp = true
enable_compile = true
batch_size = 512
opt_step_every = 1
save_every = 400
test_every = 20000
submit_every = 400

[test_play]
games = 1000
log_dir = '/home/r/Projects/better_mortal/runs/mjs/test_play'

[dataset]
globs = [
    '/home/r/Projects/better_mortal/data/houou/2019/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2020/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2021/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2022/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2023/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2024/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2025/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2026/*.mjson*',
    '/home/r/Projects/better_mortal/data/majsoul_20261006/throne/*/*.mjson.gz',
    '/home/r/Projects/better_mortal/data/majsoul_20261006/jade/*/*.mjson.gz',
]
file_index = '/home/r/Projects/better_mortal/runs/mjs/file_index.pth'
file_batch_size = 1
reserve_ratio = 0.0
num_workers = 8            # v11 = 6;只影响吞吐(每个 loader 进程分一片文件列表)
player_names_files = []
num_epochs = 1
enable_augmentation = false
augmented_first = false
symmetry_augmentation = false   # 本臂不加对称增强(v11 配方);数据来源是唯一变量

[env]
gamma = 1
pts = [6.0, 4.0, 2.0, 0.0]

[resnet]
conv_channels = 192
num_blocks = 40

[cql]
min_q_weight = 5

[aux]
next_rank_weight = 0.2

[freeze_bn]
mortal = false

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 0

[optim.scheduler]
# ⭐ Track A1 核心修复:cosine 退火 peak→final,覆盖整个 epoch
peak = 1e-4
final = 1e-5
warm_up_steps = 2000
max_steps = 2245200   # = 1.21M × 1.855(总训练样本 / 天凤样本),见文件头

[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = '/home/r/Projects/better_mortal/baseline/mortal_v4.pth'

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = '/home/r/Projects/better_mortal/baseline/mortal_v4.pth'

[grp]
state_file = '/home/r/Projects/better_mortal/runs/grp_full/grp.pth'

[grp.network]
hidden_size = 64
num_layers = 2

[1v3]
seed_key = 20260711
games_per_iter = 2000
iters = 50
log_dir = '/home/r/Projects/better_mortal/runs/mjs/1v3'

[1v3.challenger]
device = 'cuda:0'
name = 'mjs'
state_file = '/home/r/Projects/better_mortal/runs/mjs/best.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.champion]
device = 'cuda:0'
name = 'mortal-v4'
state_file = '/home/r/Projects/better_mortal/baseline/mortal_v4.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.akochan]
enabled = false
dir = ''
tactics = ''
