# [5060 Ti / WSL] 数据质量臂 q25(2026-10-12 用户「可以尝试一下最好 25%」;patches/data_quality/README.md v6 / v7)= v11 配方逐项不变,只换牌谱:
#   全部天凤凤凰 2009–2026 里,按四家玩家「自身遗憾值」(三裁判、局面分层、经验贝叶斯收缩;130,955 局玩家样本)平均分最好的 25% = 628,106 局。
#   留出 12,000 局上:比 v11 的牌谱 excess regret 低 v4 −0.0286 / C' −0.0081(均过 J/5;规则 3 的 129 万局版差一点没过,按预注册不训)。
# 步数:与 v11 相同,LR 余弦 1.21M 步,1.22M 停(symaug_run.sh);62.8 万局一遍约 59 万步,所以 num_epochs = 3、实际约过 2 遍(独立局只有 v11 的一半)。
# 判读(同 B1):12k 配对 v11 < 0 止损;否则 100k,q25 − v11 ≥ +0.5 且 z ≥ 2 才算「按玩家质量选数据」有效。
# 代码:Mortal_symaug/mortal,symmetry_augmentation = false 时走原版 load_gz_log_files 路径(= v11 的读法)。file_index 由选局列表直接生成(倒序,同 v11 的排法)。

[control]
version = 4
online = false
state_file = '/home/r/Projects/better_mortal/runs/q25/mortal.pth'
best_state_file = '/home/r/Projects/better_mortal/runs/q25/best.pth'
tensorboard_dir = '/home/r/Projects/better_mortal/runs/q25/tb'
device = 'cuda:0'
enable_cudnn_benchmark = true
enable_amp = true
enable_compile = true
batch_size = 512
opt_step_every = 1
save_every = 400
test_every = 20000
submit_every = 400

[test_play]
games = 1000
log_dir = '/home/r/Projects/better_mortal/runs/q25/test_play'

[dataset]
globs = [
    '/home/r/Projects/better_mortal/data/houou/2019/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2020/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2021/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2022/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2023/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2024/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2025/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2026/*.mjson*',
]
file_index = '/home/r/Projects/better_mortal/runs/q25/file_index.pth'
file_batch_size = 1
reserve_ratio = 0.0
num_workers = 8            # v11 = 6;只影响吞吐(每个 loader 进程分一片文件列表)
player_names_files = []
num_epochs = 3   # 一遍约 59 万步;1.22M 步由 symaug_run.sh 截停(约 2 遍)
enable_augmentation = false
augmented_first = false
symmetry_augmentation = false   # 不加增强:与 v11 同一读法,只有牌谱列表不同

[env]
gamma = 1
pts = [6.0, 4.0, 2.0, 0.0]

[resnet]
conv_channels = 192
num_blocks = 40

[cql]
min_q_weight = 5

[aux]
next_rank_weight = 0.2

[freeze_bn]
mortal = false

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 0

[optim.scheduler]
# ⭐ Track A1 核心修复:cosine 退火 peak→final,覆盖整个 epoch
peak = 1e-4
final = 1e-5
warm_up_steps = 2000
max_steps = 1210000

[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = '/home/r/Projects/better_mortal/baseline/mortal_v4.pth'

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = '/home/r/Projects/better_mortal/baseline/mortal_v4.pth'

[grp]
state_file = '/home/r/Projects/better_mortal/runs/grp_full/grp.pth'

[grp.network]
hidden_size = 64
num_layers = 2

[1v3]
seed_key = 20260711
games_per_iter = 2000
iters = 50
log_dir = '/home/r/Projects/better_mortal/runs/q25/1v3'

[1v3.challenger]
device = 'cuda:0'
name = 'q25'
state_file = '/home/r/Projects/better_mortal/runs/q25/best.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.champion]
device = 'cuda:0'
name = 'mortal-v4'
state_file = '/home/r/Projects/better_mortal/baseline/mortal_v4.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.akochan]
enabled = false
dir = ''
tactics = ''
