# [5060 Ti / WSL] q25 one pass (q25one; 2026-10-16 user: "先做 A"; patches/data_quality/README.md v9) = q25 item for item, except
#   one pass over the selected games instead of about 1.5: num_epochs = 1, the cosine LR schedule ends just before
#   the pass does, and symaug_run.sh stops the run before the trainer would finish the epoch on its own.
# Why: q25 (best 25% by player regret, ~2 passes over 628k games in 1.21M steps) came out +0.55 ± 0.60 against v11
#   at 100k, and v11long showed that more passes over the same games cost about 1.3 pt. This arm asks how much of
#   q25's selection gain the repetition was eating.
# Data: q25's list minus the logs the trainer cannot use (scan_logs.py: unreadable, or a logged action the mask marks
#   illegal, which crashed q25 twice), same order.
# Steps: a 5,000-game sample scanned with the trainer's reader has 658.7 samples per game (± 0.38%), so one pass over
#   628,106 games is about 808,000 steps at batch 512. The run stops at 795,000 (symaug_run.sh STOP; 1.5% short of the
#   pass, about 4 standard errors, so the trainer never finishes the epoch on its own) and the cosine schedule ends at
#   785,000, i.e. 10,000 steps at the final LR as in v11's 1.21M / 1.22M.

[control]
version = 4
online = false
state_file = '/home/r/Projects/better_mortal/runs/q25one/mortal.pth'
best_state_file = '/home/r/Projects/better_mortal/runs/q25one/best.pth'
tensorboard_dir = '/home/r/Projects/better_mortal/runs/q25one/tb'
device = 'cuda:0'
enable_cudnn_benchmark = true
enable_amp = true
enable_compile = true
batch_size = 512
opt_step_every = 1
save_every = 400
test_every = 20000
submit_every = 400

[test_play]
games = 1000
log_dir = '/home/r/Projects/better_mortal/runs/q25one/test_play'

[dataset]
globs = [
    '/home/r/Projects/better_mortal/data/houou/2019/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2020/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2021/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2022/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2023/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2024/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2025/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2026/*.mjson*',
]
file_index = '/home/r/Projects/better_mortal/runs/q25one/file_index.pth'
file_batch_size = 1
reserve_ratio = 0.0
num_workers = 8            # v11 = 6;只影响吞吐(每个 loader 进程分一片文件列表)
player_names_files = []
num_epochs = 1   # one pass (~808k steps); symaug_run.sh stops at 795,000, just before the pass ends
enable_augmentation = false
augmented_first = false
symmetry_augmentation = false   # 不加增强:与 v11 同一读法,只有牌谱列表不同

[env]
gamma = 1
pts = [6.0, 4.0, 2.0, 0.0]

[resnet]
conv_channels = 192
num_blocks = 40

[cql]
min_q_weight = 5

[aux]
next_rank_weight = 0.2

[freeze_bn]
mortal = false

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 0

[optim.scheduler]
# ⭐ Track A1 核心修复:cosine 退火 peak→final,覆盖整个 epoch
peak = 1e-4
final = 1e-5
warm_up_steps = 2000
max_steps = 785000

[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = '/home/r/Projects/better_mortal/baseline/mortal_v4.pth'

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = '/home/r/Projects/better_mortal/baseline/mortal_v4.pth'

[grp]
state_file = '/home/r/Projects/better_mortal/runs/grp_full/grp.pth'

[grp.network]
hidden_size = 64
num_layers = 2

[1v3]
seed_key = 20260711
games_per_iter = 2000
iters = 50
log_dir = '/home/r/Projects/better_mortal/runs/q25one/1v3'

[1v3.challenger]
device = 'cuda:0'
name = 'q25one'
state_file = '/home/r/Projects/better_mortal/runs/q25one/best.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.champion]
device = 'cuda:0'
name = 'mortal-v4'
state_file = '/home/r/Projects/better_mortal/baseline/mortal_v4.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.akochan]
