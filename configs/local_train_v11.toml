# [本地服务器] Track A1 — v1.1:修 LR schedule(加余弦衰减),其余同 v1 隔离变量
# 关键改动 vs remote_train_v1.toml:
#   [optim.scheduler] final 1e-4→1e-5, max_steps 1000→1210000(≈整个 epoch 步数)
#   → 从 warmup 后 cosine 退火到 1e-5,修复"训满变弱"
# 数据:需先在本地下好 ~/Projects/better_mortal/data/houou/(GPU-free 预备步)
# GRP:需把 weights_backup/grp_full_snapshot.pth 传到 runs/grp_full/grp.pth
# 用法:cd ~/Projects/better_mortal/Mortal/mortal && . ../../.venv/bin/activate
#       MORTAL_CFG=~/Projects/better_mortal/configs/local_train_v11.toml python train.py
# A2 变体(宽度):把 [resnet] conv_channels 改 256 另存 local_train_v11_w256.toml

[control]
version = 4
online = false
state_file = '/home/twu/Projects/better_mortal/runs/v11/mortal.pth'
best_state_file = '/home/twu/Projects/better_mortal/runs/v11/best.pth'
tensorboard_dir = '/home/twu/Projects/better_mortal/runs/v11/tb'
device = 'cuda:0'
enable_cudnn_benchmark = true
enable_amp = true
enable_compile = true
batch_size = 512
opt_step_every = 1
save_every = 400
test_every = 20000
submit_every = 400

[test_play]
games = 1000
log_dir = '/home/twu/Projects/better_mortal/runs/v11/test_play'

[dataset]
globs = [
    '/home/twu/Projects/better_mortal/data/houou/2019/*.mjson*',
    '/home/twu/Projects/better_mortal/data/houou/2020/*.mjson*',
    '/home/twu/Projects/better_mortal/data/houou/2021/*.mjson*',
    '/home/twu/Projects/better_mortal/data/houou/2022/*.mjson*',
    '/home/twu/Projects/better_mortal/data/houou/2023/*.mjson*',
    '/home/twu/Projects/better_mortal/data/houou/2024/*.mjson*',
    '/home/twu/Projects/better_mortal/data/houou/2025/*.mjson*',
    '/home/twu/Projects/better_mortal/data/houou/2026/*.mjson*',
]
file_index = '/home/twu/Projects/better_mortal/runs/v11/file_index.pth'
file_batch_size = 1
reserve_ratio = 0.0
num_workers = 6
player_names_files = []
num_epochs = 1
enable_augmentation = false
augmented_first = false

[env]
gamma = 1
pts = [6.0, 4.0, 2.0, 0.0]

[resnet]
conv_channels = 192
num_blocks = 40

[cql]
min_q_weight = 5

[aux]
next_rank_weight = 0.2

[freeze_bn]
mortal = false

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 0

[optim.scheduler]
# ⭐ Track A1 核心修复:cosine 退火 peak→final,覆盖整个 epoch
peak = 1e-4
final = 1e-5
warm_up_steps = 2000
max_steps = 1210000

[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = '/home/twu/Projects/better_mortal/baseline/mortal_v4.pth'

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = '/home/twu/Projects/better_mortal/baseline/mortal_v4.pth'

[grp]
state_file = '/home/twu/Projects/better_mortal/runs/grp_full/grp.pth'

[grp.network]
hidden_size = 64
num_layers = 2

[1v3]
seed_key = 20260711
games_per_iter = 2000
iters = 50
log_dir = '/home/twu/Projects/better_mortal/runs/v11/1v3'

[1v3.challenger]
device = 'cuda:0'
name = 'v11'
state_file = '/home/twu/Projects/better_mortal/runs/v11/best.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.champion]
device = 'cuda:0'
name = 'mortal-v4'
state_file = '/home/twu/Projects/better_mortal/baseline/mortal_v4.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.akochan]
enabled = false
dir = ''
tactics = ''
