# [trx] 对称增强第二臂(2026-10-05,patches/symmetry_augmentation)= B1 配方(v11 × 256×54)逐项不变 × 对称增强(单变量对照 B1)
# 与 5060 Ti 上的 symaug(192×40)合成 2×2:增强 有/无 × 尺寸 192×40 / 256×54(无增强两格 = v11 / B1,均已有 100k)。
# 判读(预注册,同 B1):1.22M 步停训;12k 配对 B1 点估计 < 0 → 止损;否则 100k,symaug256 − B1 ≥ +0.5 且 z ≥ 2 才算本臂通过;
#   另报增强主效应 = 两臂(symaug − v11、symaug256 − B1)的平均,交互项 = 两者之差。
# 代码:单独的 Mortal_symaug/mortal 树(与 WSL 那棵逐文件相同:train.py ba587de4 + 开关,dataloader 29e7a08d + 增强,player.py 用 09-30 前版本)。
# 用法:(NAME=symaug256 setsid nohup bash ~/Projects/better_mortal/runs/symaug256/symaug_run.sh > /dev/null 2>&1 &)

[control]
version = 4
online = false
state_file = '/home/twu/Projects/better_mortal/runs/symaug256/mortal.pth'
best_state_file = '/home/twu/Projects/better_mortal/runs/symaug256/best.pth'
tensorboard_dir = '/home/twu/Projects/better_mortal/runs/symaug256/tb'
device = 'cuda:0'
enable_cudnn_benchmark = true
enable_amp = true
enable_compile = true
batch_size = 512
opt_step_every = 1
save_every = 400
test_every = 20000
submit_every = 400

[test_play]
games = 1000
log_dir = '/home/twu/Projects/better_mortal/runs/symaug256/test_play'

[dataset]
globs = [
    '/home/twu/Projects/better_mortal/data/houou/2019/*.mjson*',
    '/home/twu/Projects/better_mortal/data/houou/2020/*.mjson*',
    '/home/twu/Projects/better_mortal/data/houou/2021/*.mjson*',
    '/home/twu/Projects/better_mortal/data/houou/2022/*.mjson*',
    '/home/twu/Projects/better_mortal/data/houou/2023/*.mjson*',
    '/home/twu/Projects/better_mortal/data/houou/2024/*.mjson*',
    '/home/twu/Projects/better_mortal/data/houou/2025/*.mjson*',
    '/home/twu/Projects/better_mortal/data/houou/2026/*.mjson*',
]
file_index = '/home/twu/Projects/better_mortal/runs/symaug256/file_index.pth'
file_batch_size = 1
reserve_ratio = 0.0
num_workers = 8            # B1 = 6;只影响吞吐(每个 loader 进程分一片文件列表)
player_names_files = []
num_epochs = 1
enable_augmentation = false
augmented_first = false
# 唯一改动:每个牌谱按均匀随机的一个对称重新标号(花色 6 种置换 × 三元牌 3 种轮换 = 18,含恒等),见 Mortal_symaug/mortal/symaug.py
symmetry_augmentation = true

[env]
gamma = 1
pts = [6.0, 4.0, 2.0, 0.0]

[resnet]
conv_channels = 256
num_blocks = 54

[cql]
min_q_weight = 5

[aux]
next_rank_weight = 0.2

[freeze_bn]
mortal = false

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 0

[optim.scheduler]
# ⭐ Track A1 核心修复:cosine 退火 peak→final,覆盖整个 epoch
peak = 1e-4
final = 1e-5
warm_up_steps = 2000
max_steps = 1210000

[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = '/home/twu/Projects/better_mortal/baseline/mortal_v4.pth'

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = '/home/twu/Projects/better_mortal/baseline/mortal_v4.pth'

[grp]
state_file = '/home/twu/Projects/better_mortal/runs/grp_full/grp.pth'

[grp.network]
hidden_size = 64
num_layers = 2

[1v3]
seed_key = 20260711
games_per_iter = 2000
iters = 50
log_dir = '/home/twu/Projects/better_mortal/runs/symaug256/1v3'

[1v3.challenger]
device = 'cuda:0'
name = 'v11'
state_file = '/home/twu/Projects/better_mortal/runs/symaug256/best.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.champion]
