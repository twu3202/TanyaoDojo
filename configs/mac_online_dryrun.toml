# [Mac 隔离] Track C 完整三件套 dry-run:server+worker+trainer,v1_best 热启动,极小规模
# 目的:验证在线RL整条链路(自对弈→buffer→训练→推参数)能循环,非产出模型
[control]
version = 4
online = true
device = 'cpu'
enable_cudnn_benchmark = false
enable_amp = false
enable_compile = false
state_file = '/tmp/mortal_dryrun/online_dry/state.pth'
best_state_file = '/tmp/mortal_dryrun/online_dry/best.pth'
tensorboard_dir = '/tmp/mortal_dryrun/online_dry/tb'
batch_size = 64
opt_step_every = 1
save_every = 50
test_every = 1000000
submit_every = 15

[online]
history_window = 10
enable_compile = false

[online.remote]
host = '127.0.0.1'
port = 5577

[online.server]
buffer_dir = '/tmp/mortal_dryrun/online_dry/buffer'
drain_dir = '/tmp/mortal_dryrun/online_dry/drain'
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 8
force_sequential = false

[test_play]
games = 4
log_dir = '/tmp/mortal_dryrun/online_dry/test_play'

[train_play.default]
games = 8
log_dir = '/tmp/mortal_dryrun/online_dry/train_play'
boltzmann_epsilon = 0.005
boltzmann_temp = 0.05
top_p = 1.0
repeats = 1

[dataset]
globs = []
file_index = '/tmp/mortal_dryrun/online_dry/file_index.pth'
file_batch_size = 1
reserve_ratio = 0.0
num_workers = 0
player_names_files = []
num_epochs = 1000000
enable_augmentation = false
augmented_first = false

[env]
gamma = 1
pts = [6.0, 4.0, 2.0, 0.0]

[resnet]
conv_channels = 192
num_blocks = 40

[cql]
min_q_weight = 5

[aux]
next_rank_weight = 0.2

[freeze_bn]
mortal = true

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 0

[optim.scheduler]
peak = 1e-5
final = 1e-5
warm_up_steps = 0
max_steps = 100000000

[baseline.train]
device = 'cpu'
enable_compile = false
state_file = '/Users/r/HMM/Better_mortal/weights_backup/v1_best.pth'

[baseline.test]
device = 'cpu'
enable_compile = false
state_file = '/Users/r/HMM/Better_mortal/weights_backup/v1_best.pth'

[grp]
state_file = '/Users/r/HMM/Better_mortal/weights_backup/grp_full_snapshot.pth'

[grp.network]
hidden_size = 64
num_layers = 2
