# [5060 Ti / WSL] 离线基座 + 对称增强(2026-10-05,patches/symmetry_augmentation)= v11 配方逐项不变 × 对称增强(单变量对照)
# 为什么:在线 RL 改进机制一线结案(Stage 1 / M1 / M1-sel 相对对照续跑都 ≈ 0),回到离线基座;我们所有离线配置都没开增强。
#   花色置换 × 三元牌轮换 = 18 个精确对称(三元牌对换不算:宝牌指示牌白→發→中→白 是有向的);每局随机取一个,
#   每 epoch 样本数不变 —— 检验的是「强制等变 + 同一局面换标号的多样性」能不能把离线基座抬起来。
# 对照:v11(同数据 2019–2026 共 1,289,661 局、同 pts [6,4,2,0]、同 CQL 5、同 LR 余弦 1e-4→1e-5、同 batch 512、同 192×40)。
# 判读(预注册,同 B1):1.22M 步(v11 best 同点)停训;12k 配对 v11 点估计 < 0 → 止损;否则 100k,
#   symaug − v11 ≥ +0.5 且 z ≥ 2 才接在线 RL(tpt 配方),否则对称增强对离线基座排除。
# 代码:单独的 Mortal_symaug/mortal 树(train.py = trx 锚版 ba587de4 + symmetry_augmentation 开关,dataloader = 29e7a08d + 增强),
#   不动 Mortal/mortal。file_index 与 v11 同集合(WSL 路径),开跑前核对过。
# 用法:cd ~/Projects/better_mortal/Mortal_symaug/mortal && MORTAL_CFG=~/Projects/better_mortal/configs/local_train_symaug.toml ../../.venv/bin/python train.py

[control]
version = 4
online = false
state_file = '/home/r/Projects/better_mortal/runs/symaug/mortal.pth'
best_state_file = '/home/r/Projects/better_mortal/runs/symaug/best.pth'
tensorboard_dir = '/home/r/Projects/better_mortal/runs/symaug/tb'
device = 'cuda:0'
enable_cudnn_benchmark = true
enable_amp = true
enable_compile = true
batch_size = 512
opt_step_every = 1
save_every = 400
test_every = 20000
submit_every = 400

[test_play]
games = 1000
log_dir = '/home/r/Projects/better_mortal/runs/symaug/test_play'

[dataset]
globs = [
    '/home/r/Projects/better_mortal/data/houou/2019/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2020/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2021/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2022/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2023/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2024/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2025/*.mjson*',
    '/home/r/Projects/better_mortal/data/houou/2026/*.mjson*',
]
file_index = '/home/r/Projects/better_mortal/runs/symaug/file_index.pth'
file_batch_size = 1
reserve_ratio = 0.0
num_workers = 8            # v11 = 6;只影响吞吐(每个 loader 进程分一片文件列表)
player_names_files = []
num_epochs = 1
enable_augmentation = false
augmented_first = false
# 唯一改动:每个牌谱按均匀随机的一个对称重新标号(花色 6 种置换 × 三元牌 3 种轮换 = 18,含恒等),见 Mortal_symaug/mortal/symaug.py
symmetry_augmentation = true

[env]
gamma = 1
pts = [6.0, 4.0, 2.0, 0.0]

[resnet]
conv_channels = 192
num_blocks = 40

[cql]
min_q_weight = 5

[aux]
next_rank_weight = 0.2

[freeze_bn]
mortal = false

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 0

[optim.scheduler]
# ⭐ Track A1 核心修复:cosine 退火 peak→final,覆盖整个 epoch
peak = 1e-4
final = 1e-5
warm_up_steps = 2000
max_steps = 1210000

[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = '/home/r/Projects/better_mortal/baseline/mortal_v4.pth'

